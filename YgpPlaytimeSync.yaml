Description: |-
  Sends your Playnite playtime to your Your Gamer Profile (YGP) account automatically: syncs when a game closes, keeps recent games on top, sends start/completion dates, detects manual hour edits and can set the completion date after N days without playing.

  Interface in English, Português (Brasil) and Español. Unofficial project, not affiliated with Your Gamer Profile.
